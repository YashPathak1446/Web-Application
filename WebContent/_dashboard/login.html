<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="../frontend/login.css">
    <title>Employee Login page</title>
</head>
<body>
<div class="login-wrapper">
    <h2>Employee Login</h2>

    <form id="login_form" method="post" action="#">
        <div class="container">
            <label><b>Username</b></label>
            <label>
                <input id="email" name="email" placeholder="Enter Email" type="text">
            </label>
            <br>
            <label><b>Password</b></label>
            <label>
                <input id="password" name="password" placeholder="Enter Password" type="password">
            </label>
            <input type="submit" value="Login">
            <div class="g-recaptcha" data-sitekey="6LfYOtAqAAAAAJfvSGN5bTcUqiEpN4-0OQCM5Xiw"></div>
<!--            <div class="g-recaptcha" data-sitekey="6Lf-_-MqAAAAADnMLCeE1RGMvCF-od0K_t3xGE0c"></div>-->
        </div>
    </form>
    <div id="login_error_message"></div>
</div>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="../routes/employee-login.js"></script>
<script src='https://www.google.com/recaptcha/api.js' type="text/javascript"></script>
</body>
</html>

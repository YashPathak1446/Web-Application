<!-- This example is following frontend and backend separation.

    This .html performs two steps:
    1. Create a html template skeleton, with all the elements defined (some left empty) and named with ids.
    2. Load single-star.js to populate the data into empty elements.
    -->

<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="single-star.css">
    <title>Single Star</title>
</head>
<body>
<div id="header">
    <button id="main_button"><a href="../frontend/main.html" id="main_link">Home</a></button>
    <button id="top20button"><a href="../frontend/movies.html" id="top20link">Top 20 Movies</a></button>
    <a id="backToMovies" href="${previousMoviesPage}">← Back to Movie List </a>
    <button id="checkout_button"><a href="../frontend/checkout.html" id="checkout_link">Checkout</a></button>
    <form id="logout_button" method="POST">
        <input type="submit" value="Logout" id="logout">
    </form>
</div>
    <div id=star_info></div>
    <table>
        <thead>
        <tr>
            <th>Movies</th>
        </tr>
        </thead>

        <!-- Table body is left empty here, will be populated with the data retrieved with single-star.js -->
        <!-- single-star.js will find this html element by it's id "movie_table_body" -->
        <tbody id=single_star_table_body></tbody>
    </table>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="../routes/single-star.js"></script>
</body>


</html>

<!-- This example is following frontend and backend separation.

    This .html performs two steps:
    1. Create a html template skeleton, with all the elements defined (some left empty) and named with ids.
    2. Load index.js to populate the data into empty elements.
    -->

<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="single-movie.css">
    <title>Movie List</title>
</head>
<body>
<div id="header">
    <button id="main_button"><a href="../frontend/main.html" id="main_link">Home</a></button>
    <button id="top20button"><a href="../frontend/movies.html" id="top20link">Top 20 Movies</a></button>
    <a id="backToMovies" href="#">← Back to Movie List </a>
    <form id="search_form" method = "GET" autocomplete="off">
        <label>Search: <input type="text" id="autocomplete" name="search" autocomplete="off"></label>
        <div id="dropdown" class="dropdown"></div>
        <br>
        <input type="submit" value="Search">
    </form>
    <button id="header-add-to-cart" disabled>Add to Cart</button>
<!--    <button class="add-to-cart" data-id="${resultData[i]['movie_id']}"-->
<!--            data-title="${resultData[i]['movie_title']}" data-price="${moviePrice}" id="cart_link">-->
<!--        Add to Cart-->
<!--    </button>-->

    <button id="checkout_button"><a href="../frontend/checkout.html" id="checkout_link">Checkout</a></button>
    <form id="logout_button" method="POST">
        <input type="submit" value="Logout" id="logout">
    </form>
</div>
    <div>

        <h1 id=movie_info></h1>

        <div class="horizontalDiv">
            <table class="horizontalElement">
                <thead>
                <tr>
                    <th>Genres</th>
                </tr>
                </thead>
                <tbody id=movie_genres></tbody>
            </table>

            <!-- Id "movie_table" is useful for jQuery to find the html element with id, class here is mapping to Bootstrap defined class CSS -->
            <table class="horizontalElement">
                <thead>
                <tr>
                    <th>Stars</th>
                </tr>
                </thead>
                <!-- Table body is left empty here, will be populated with the data retrieved with index.js -->
                <!-- Again, id "star_table_body" is useful for jQuery to find this html element -->
                <tbody id=movie_stars></tbody>
            </table>
        </div>

        <!-- Load jQuery and Bootstrap JS -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>
        <script src="../routes/single-movie.js"></script>
        <script type='text/javascript' src='../routes/main.js'></script>
    </div>
</body>


</html>

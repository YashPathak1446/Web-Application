<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>
<div id="header">
  <button id="main_button"><a href="../frontend/main.html" id="main_link">Home</a></button>
  <button id="top20button"><a href="../frontend/movies.html" id="top20link">Top 20 Movies</a></button>

  <form id = "search_form" method = "GET">
    <label>Title: <input type="text" name="title"></label>
    <br>
    <label>Year: <input type="number" name="year"></label>
    <br>
    <label>Director: <input type="text" name="director"></label>
    <br>
    <label>Star: <input type="text" name="star"></label>
    <br>
    <input type="submit" value="Search">
  </form>

    <form id="logout_button" method="POST">
        <input type="submit" value="Logout" id="logout">
    </form>
</div>
<h1>Shopping Cart</h1>

<div id="inner_body">
    <table id="cart_table">
      <thead>
      <tr>
        <th>Movie Title</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="cart_body"></tbody>
    </table>

    <h3>Total Price: $<span id="cart_total">0.00</span></h3>
    <button id="proceed_to_payment"><a href="../frontend/payment.html" id="payment_link">Proceed to Payment</a></button>
</div>


<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
<script src="../routes/checkout.js"></script>
</body>
</html>

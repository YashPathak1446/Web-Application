<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="list.html view port"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Using the same css from movies.css -->
    <link rel="stylesheet" href="movies.css">
    <title>Search Results</title>
</head>
<body>
<div id="header">
    <button id="main_button"><a href="../frontend/main.html" id="main_link">Home</a></button>
    <button id="top20button"><a href="../frontend/movies.html" id="top20link">Top 20 Movies</a></button>
    <form id="search_form" method = "GET" autocomplete="off">
        <label>Search: <input type="text" id="autocomplete" name="search" autocomplete="off"></label>
        <div id="dropdown" class="dropdown"></div>
        <br>
        <input type="submit" value="Search">
    </form>
    <button id="checkout_button"><a href="../frontend/checkout.html" id = "checkout_link">Checkout</a></button>
    <form id="logout_button" method="POST">
        <input type="submit" value="Logout" id="logout">
    </form>
</div>
<h1>Search Results</h1>

<div id="formDiv">
    <form METHOD="GET" id="pageLengthForm">
        <label for="sort">Sort by</label>
        <select name="sort" id="sort">
            <option value ="TARA" default>Title ASC, Rating ASC</option>
            <option value ="TARD">Title ASC, Rating DESC</option>
            <option value ="TDRD">Title DESC, Rating DESC</option>
            <option value ="TDRA">Title DESC, Rating ASC</option>
            <option value ="RATA">Rating ASC, Title ASC</option>
            <option value ="RATD">Rating ASC, Title DESC</option>
            <option value ="RDTD">Rating DESC, Title DESC</option>
            <option value ="RDTA">Rating DESC, Title ASC</option>
        </select>
        <label for="pageLength">page length</label>
        <select name="pageLength" id="pageLength">
            <option value="10" default>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
        <input id="pageLengthSubmit" type="submit" value="Submit">
    </form>
</div>

<table id="movie_table" class="table table-striped">
    <thead>
    <tr>
        <th>Movie Title</th>
        <th>Release Year</th>
        <th>Director</th>
        <th>Genres</th>
        <th>Stars</th>
        <th>Rating</th>
        <th>Cart</th>
    </tr>
    </thead>
    <tbody id="movie_table_body"></tbody>
</table>

<div id="pageButtonDiv">
    <button id="prevPage"><</button>
    <button id="nextPage">></button>
</div>

<!-- Load jQuery -->
<script src='https://code.jquery.com/jquery-3.1.0.min.js'></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<!-- Load your own JavaScript -->
<script src="../routes/list.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>
<script type='text/javascript' src='../routes/main.js'></script>
</body>
</html>
